# Values ship reads. The prose is in README.md; the loop is in
# ~/notes/releasing.md. Format and keys: anderix/ship, docs/PROFILE.md.
#
# The package is Architecture: all — one file serves every architecture — and
# there is no workflow to build it. It is a shell script over committed data,
# so it rides the release as an attachment rather than being fetched from a
# job: `ship slipcase/slipcase-common 1.1.0 --attach dist/<the .deb>`.
loop=hand-cut
version_file=debian/changelog
apt_package=slipcase-common
deb_packages=1
deb_arches=amd64 arm64
deb_arch_independent=yes
crates=
homebrew=no
winget=
store_lanes=
display_name=Slipcase Common
packages_workflow=none
