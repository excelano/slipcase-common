<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    A Slipcase container holding an image.

    Author: David M. Anderson
    Built with AI assistance (Claude, Anthropic)

    The comment is inside the element for the reason
    `application-vnd.excelano.slipcase+zip.svg` records.

    Two peaks and a sun, filled rather than stroked. It is the one payload mark
    here that is a silhouette instead of a colour, because it is the one whose
    silhouette a person already knows: at 16 pixels the peaks become a single
    dark wedge low on the card and the sun a dot above it, which is still not
    the block of rules a document draws.
  -->
  <g stroke="#2f3337" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- The card, protruding well above the case's mouth. -->
    <rect x="20" y="4" width="25" height="36" rx="2" fill="#f2ece1"/>
    <!-- The payload mark. -->
    <g fill="#2f7d4f" stroke="none">
      <circle cx="26" cy="13" r="2.8"/>
      <path d="M22.5 27 L29.5 16 L34 22 L38.5 16.5 L43 27 Z"/>
    </g>
    <!-- The case: open along the top, closed on the other three sides. -->
    <path d="M8 31 h48 v22 a4 4 0 0 1 -4 4 h-40 a4 4 0 0 1 -4 -4 z" fill="#4a6fa5"/>
    <!-- The mouth, a darker band so the top edge reads as an opening. -->
    <path d="M8 31 h48 v7 h-48 z" fill="#38557f" stroke="none"/>
    <path d="M8 38 h48" fill="none"/>
  </g>
</svg>
