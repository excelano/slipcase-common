<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    A Slipcase container holding a document: a word processor file, or plain
    text, or one of the small structured text formats.

    Author: David M. Anderson
    Built with AI assistance (Claude, Anthropic)

    The comment is inside the element for the reason
    `application-x.slipcase+zip.svg` records.

    Three rules where the base drawing has two, in ink rather than grey, the
    last one short. Text and word processor payloads share this mark rather than
    taking one each: two rule-based marks differ by nothing a person can see at
    16 pixels, which is the size this was checked at, so shipping both would be
    two drawings carrying one distinction.
  -->
  <g stroke="#2f3337" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- The card, protruding well above the case's mouth. -->
    <rect x="20" y="4" width="25" height="36" rx="2" fill="#f2ece1"/>
    <!-- The payload mark. -->
    <g stroke="#3b4a9c" stroke-width="3" fill="none">
      <line x1="23.5" y1="13" x2="41.5" y2="13"/>
      <line x1="23.5" y1="19.5" x2="41.5" y2="19.5"/>
      <line x1="23.5" y1="26" x2="35" y2="26"/>
    </g>
    <!-- The case: open along the top, closed on the other three sides. -->
    <path d="M8 31 h48 v22 a4 4 0 0 1 -4 4 h-40 a4 4 0 0 1 -4 -4 z" fill="#4a6fa5"/>
    <!-- The mouth, a darker band so the top edge reads as an opening. -->
    <path d="M8 31 h48 v7 h-48 z" fill="#38557f" stroke="none"/>
    <path d="M8 38 h48" fill="none"/>
  </g>
</svg>
